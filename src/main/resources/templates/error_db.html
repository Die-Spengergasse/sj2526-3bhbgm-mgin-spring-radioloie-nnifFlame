<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head('Datenbankfehler')}"></head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-danger text-white py-3">
                        <h4 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> Datenbankfehler</h4>
                    </div>
                    <div class="card-body p-5 text-center">
                        <h2 class="text-danger mb-4">Verbindung fehlgeschlagen</h2>
                        <p class="fs-5 mb-4" th:text="${errorMessage}">Fehlermeldung hier...</p>
                        <div class="alert alert-info text-start">
                            <strong>Mögliche Lösung:</strong>
                            <ol class="mb-0 mt-2">
                                <li>Öffnen Sie das <strong>XAMPP Control Panel</strong>.</li>
                                <li>Klicken Sie bei <strong>MySQL</strong> auf den Button <strong>Start</strong>.</li>
                                <li>Laden Sie diese Seite neu.</li>
                            </ol>
                        </div>
                        <a th:href="@{/}" class="btn btn-primary mt-4 px-4">Erneut versuchen</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
